<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>냠냠레벨업 썸네일</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #4a2b19;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", sans-serif;
        background:
          radial-gradient(circle at 18% 22%, #ffffff 0 5%, transparent 21%),
          radial-gradient(circle at 78% 82%, #fff4d2 0 7%, transparent 25%),
          linear-gradient(135deg, #fffaf0 0%, #fff1cf 52%, #ffca78 100%);
      }

      main {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 96px 112px 92px 150px;
      }

      .copy {
        position: relative;
        z-index: 2;
        width: 58%;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 62px;
        padding: 0 30px;
        border: 2px solid rgba(255, 159, 67, 0.28);
        border-radius: 999px;
        color: #a25419;
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -0.5px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 12px 34px rgba(139, 83, 31, 0.09);
      }

      h1 {
        margin: 34px 0 22px;
        font-size: 112px;
        font-weight: 900;
        letter-spacing: -6px;
        line-height: 1.04;
      }

      .highlight {
        color: #ed7c24;
      }

      p {
        max-width: 860px;
        margin: 0;
        color: #69462f;
        font-size: 44px;
        font-weight: 720;
        letter-spacing: -1.8px;
        line-height: 1.42;
      }

      .mascot-wrap {
        position: absolute;
        right: -46px;
        bottom: -188px;
        width: 940px;
        height: 940px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.42);
        box-shadow:
          0 34px 90px rgba(132, 76, 26, 0.16),
          inset 0 0 0 3px rgba(255, 255, 255, 0.45);
      }

      .mascot {
        position: absolute;
        z-index: 1;
        right: 20px;
        bottom: -210px;
        width: 900px;
        height: 900px;
        object-fit: contain;
        filter: drop-shadow(0 35px 28px rgba(104, 59, 19, 0.21));
      }

      .seed {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 12px 28px rgba(139, 83, 31, 0.08);
      }

      .seed-one {
        top: 70px;
        right: 190px;
        width: 46px;
        height: 46px;
      }

      .seed-two {
        top: 140px;
        right: 110px;
        width: 26px;
        height: 26px;
      }
    </style>
  </head>
  <body>
    <main aria-label="냠냠레벨업 앱인토스 썸네일">
      <section class="copy">
        <div class="eyebrow">오늘 급식 · 한입 도전 · 다람쥐 성장</div>
        <h1>냠냠<span class="highlight">레벨업</span></h1>
        <p>오늘 급식을 기록하고<br />귀여운 다람쥐를 키워요</p>
      </section>
      <div class="mascot-wrap" aria-hidden="true"></div>
      <img
        class="mascot"
        src="/growth/level-7.png"
        alt="트로피를 든 냠냠레벨업 다람쥐"
      />
      <span class="seed seed-one" aria-hidden="true"></span>
      <span class="seed seed-two" aria-hidden="true"></span>
    </main>
  </body>
</html>
