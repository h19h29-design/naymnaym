<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>급식레벨업 Google Play 그래픽 이미지</title>
    <style>
      * { box-sizing: border-box; }
      html,
      body {
        width: 1024px;
        height: 500px;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      }
      #feature {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background:
          radial-gradient(circle at 82% 10%, rgba(255, 229, 139, 0.95), transparent 235px),
          radial-gradient(circle at 10% 95%, rgba(144, 201, 87, 0.44), transparent 300px),
          linear-gradient(128deg, #fff9e9 0%, #eef7d8 50%, #a7d16d 100%);
        color: #14392c;
      }
      #feature::before {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(25, 88, 57, 0.16) 0.8px, transparent 0.8px);
        background-size: 18px 18px;
        content: "";
        opacity: 0.22;
      }
      .copy {
        position: absolute;
        z-index: 3;
        top: 68px;
        left: 76px;
        width: 580px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        color: #205e43;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .brand img {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(25, 88, 57, 0.18);
      }
      .eyebrow {
        margin: 0 0 10px;
        color: #2e754f;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      h1 {
        margin: 0;
        font-size: 63px;
        font-weight: 950;
        letter-spacing: -0.075em;
        line-height: 1.06;
      }
      h1 span {
        color: #eb842f;
      }
      .tags {
        display: flex;
        gap: 10px;
        margin-top: 27px;
      }
      .tag {
        padding: 8px 14px;
        border: 1px solid rgba(24, 84, 58, 0.12);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.64);
        color: #365c4c;
        font-size: 14px;
        font-weight: 750;
      }
      .orb {
        position: absolute;
        z-index: 1;
        top: -102px;
        right: -52px;
        width: 540px;
        height: 540px;
        border-radius: 44% 56% 58% 42% / 45% 44% 56% 55%;
        background:
          radial-gradient(circle at 34% 25%, rgba(255, 255, 255, 0.82), transparent 150px),
          linear-gradient(145deg, #d7eea2, #6bab59 68%, #367b50);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.5),
          0 38px 82px rgba(35, 104, 60, 0.24);
        transform: rotate(-8deg);
      }
      .mascot {
        position: absolute;
        z-index: 2;
        right: 10px;
        bottom: -78px;
        width: 460px;
        filter: drop-shadow(0 28px 30px rgba(52, 66, 28, 0.24));
      }
      .spark {
        position: absolute;
        z-index: 4;
        color: #fff7ce;
        font-size: 40px;
        line-height: 1;
        text-shadow: 0 5px 16px rgba(45, 100, 53, 0.18);
      }
      .spark.one { top: 58px; right: 85px; }
      .spark.two { top: 168px; right: 425px; font-size: 25px; }
      .spark.three { right: 45px; bottom: 92px; font-size: 28px; }
    </style>
  </head>
  <body>
    <main id="feature" aria-label="급식레벨업 Google Play 그래픽 이미지">
      <div class="copy">
        <div class="brand">
          <img src="./assets/app-icon.png" alt="" />
          <span>급식레벨업</span>
        </div>
        <p class="eyebrow">오늘 급식 확인하고</p>
        <h1>한 입 도전으로<br /><span>캐릭터 레벨업</span></h1>
        <div class="tags">
          <span class="tag">학교 급식</span>
          <span class="tag">식사 기록</span>
          <span class="tag">캐릭터 성장</span>
        </div>
      </div>
      <div class="orb" aria-hidden="true"></div>
      <img class="mascot" src="./assets/mascot-heart.png" alt="" />
      <span class="spark one" aria-hidden="true">✦</span>
      <span class="spark two" aria-hidden="true">✦</span>
      <span class="spark three" aria-hidden="true">✦</span>
    </main>
  </body>
</html>
