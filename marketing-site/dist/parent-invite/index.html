<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>급식레벨업 보호자 초대 시작</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #fff9e8 0%, #eef9df 100%);
      color: #2d261e;
      margin: 0;
      padding: 24px;
    }
    .invite-card {
      width: min(100%, 460px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(76, 175, 80, 0.18);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(40, 92, 38, 0.14);
      padding: 28px 24px;
      text-align: center;
    }
    .invite-card img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .invite-card h1 {
      margin: 6px 0 8px;
      font-size: clamp(26px, 7vw, 34px);
      letter-spacing: 0;
      color: #238036;
    }
    .invite-card p {
      margin: 8px 0;
      line-height: 1.58;
      font-size: 16px;
    }
    .button {
      display: block;
      margin-top: 18px;
      border-radius: 18px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #6ac443, #238036);
      box-shadow: 0 10px 20px rgba(35, 128, 54, 0.24);
    }
    .hint {
      color: #706b61;
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="invite-card">
    <img src="../assets/mascot-thumb.png" alt="급식레벨업 캐릭터">
    <h1>보호자 초대 시작</h1>
    <p>아이 기기에서 급식레벨업을 열고 보호자 연결 링크를 만들 수 있어요.</p>
    <a class="button" id="openApp" href="nyamnyam://parent-invite">앱에서 초대 링크 만들기</a>
    <p class="hint">앱이 열리지 않으면 앱 설치 후 다시 시도해 주세요.</p>
  </main>
  <script>
    window.setTimeout(() => {
      window.location.href = "nyamnyam://parent-invite";
    }, 350);
  </script>
</body>
</html>
