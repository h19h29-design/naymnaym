plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.kapt"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def quoteBuildConfig = { value ->
    def safeValue = (value ?: "").toString()
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
    return "\"${safeValue}\""
}

android {
    namespace "com.h19h29.naymnaymlevelup"
    compileSdk 36

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libandroidx.graphics.path.so"]
        }
    }

    defaultConfig {
        applicationId "com.h19h29.naymnaymlevelup"
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "boolean", "NATIVE_REBUILD_ENABLED", "false"
        buildConfigField "String", "NEIS_API_KEY", quoteBuildConfig(localProperties.getProperty("NEIS_API_KEY", ""))
        buildConfigField "String", "PARENT_SYNC_API_BASE_URL", quoteBuildConfig(localProperties.getProperty(
            "PARENT_SYNC_API_BASE_URL",
            "https://rytfbovyyzjlrtzdzldo.supabase.co/functions/v1/parent-sync"
        ))
    }

    signingConfigs {
        release {
            def storeFilePath = localProperties.getProperty("ANDROID_KEYSTORE_FILE", "")
            if (storeFilePath) {
                storeFile rootProject.file(storeFilePath)
                storePassword localProperties.getProperty("ANDROID_KEYSTORE_PASSWORD", "")
                keyAlias localProperties.getProperty("ANDROID_KEY_ALIAS", "naymnaym-upload")
                keyPassword localProperties.getProperty("ANDROID_KEY_PASSWORD", "")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "NATIVE_REBUILD_ENABLED", "false"
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            buildConfigField "boolean", "NATIVE_REBUILD_ENABLED", "true"
            minifyEnabled false
            if (localProperties.getProperty("ANDROID_KEYSTORE_FILE", "")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.12.01")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    implementation "com.fasterxml.jackson.core:jackson-core:2.18.3"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    kapt "androidx.room:room-compiler:2.8.4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    androidTestImplementation "androidx.room:room-testing:2.8.4"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.github.javaparser:javaparser-core:3.26.4"
    testImplementation "org.json:json:20250517"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
}

tasks.withType(Test).configureEach {
    if (name == "testDebugUnitTest") {
        dependsOn "processDebugMainManifest"
        systemProperty(
            "rebuild.mergedManifest",
            layout.buildDirectory
                .file("intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml")
                .get()
                .asFile
                .absolutePath
        )
        systemProperty(
            "rebuild.mainActivitySource",
            layout.projectDirectory
                .file("src/main/java/com/h19h29/naymnaymlevelup/MainActivity.java")
                .asFile
                .absolutePath
        )
    }
}
