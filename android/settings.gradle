pluginManagement {
    // Kotlin 2.2 requires D8/R8 8.10.21 or newer. AGP 8.9.1 bundles an older
    // compiler, so use the official R8 override mechanism while preserving AGP.
    // Version table: https://developer.android.com/build/kotlin-support
    // Override docs: https://r8.googlesource.com/r8/+/refs/tags/8.10.21/README.md
    buildscript {
        repositories {
            mavenCentral()
            maven {
                url uri("https://storage.googleapis.com/r8-releases/raw")
            }
        }
        dependencies {
            classpath "com.android.tools:r8:8.10.21"
        }
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "NaymNaymLevelUpAndroid"
include ":app"
